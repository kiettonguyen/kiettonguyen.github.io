<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Scoping a project · Module 1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Module 1 of "Project work and financial compliance", rebuilt for Riverbend City Council's
       newsletter. Visual language: a planning sheet. Scoping is drawing a boundary around work,
       so every page is a numbered drawing sheet with a title block, a map-style legend and
       survey marks: blue for what's in, red for the boundary and what's out, yellow for limits. */
    :root {
      --paper: #F3F4EF;
      --sheet: #FBFBF8;
      --ink: #17232A;
      --ink-2: #4B5961;
      --hair: rgba(23, 35, 42, .16);
      --grid: rgba(31, 86, 163, .055);
      --plan: #1F56A3;
      --plan-tint: #E4ECF7;
      --boundary: #B23520;
      --boundary-tint: #F8E3DE;
      --flag: #F2BE3A;
      --flag-tint: #FCF0CF;
      --field: #24693F;
      --field-tint: #E2F1E7;
      --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
      --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --side: 248px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font: 400 17px/1.6 var(--body);
      background-color: var(--paper);
      /* drafting paper: a fine blue grid with a heavier line every five squares */
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(rgba(31, 86, 163, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 86, 163, .05) 1px, transparent 1px);
      background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
    }
    a { color: var(--plan); text-underline-offset: 3px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--plan); outline-offset: 2px; }
    .vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .label { font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

    /* ---------- the course frame (the LMS around the content) ---------- */
    .skip { position: absolute; left: 12px; top: 8px; z-index: 50; padding: 8px 12px; background: var(--ink); color: var(--paper); transform: translateY(-200%); }
    .skip:focus { transform: none; }
    .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 8px 20px; background: var(--ink); color: var(--paper); }
    .bar .course { font: 600 18px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0; }
    .bar .course small { display: block; font: 400 11px/1.4 var(--mono); letter-spacing: .06em; opacity: .75; }
    .bar .menu { display: none; border: 1px solid rgba(243, 244, 239, .5); background: none; color: var(--paper); padding: 6px 10px; font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .bar :focus-visible { outline-color: var(--flag); }
    /* progress drawn as a map scale bar: one segment per sheet, filled once visited */
    .scale { display: flex; align-items: center; gap: 10px; font: 400 11px/1 var(--mono); letter-spacing: .05em; white-space: nowrap; }
    .scale ol { display: flex; list-style: none; margin: 0; padding: 0; border: 1px solid var(--paper); }
    .scale li { width: 22px; height: 8px; }
    .scale li + li { border-left: 1px solid var(--paper); }
    .scale li.seen { background: var(--paper); }
    .scale li.now { background: var(--flag); }

    /* the sheet index runs the full height of the page, as one column of the frame */
    .frame { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; min-height: calc(100vh - 52px);
      background: linear-gradient(90deg, var(--sheet) calc(var(--side) - 1.5px), var(--ink) calc(var(--side) - 1.5px) var(--side), transparent var(--side)); }
    .sheets { position: sticky; top: 52px; max-height: calc(100vh - 52px); overflow: auto; padding: 24px 18px 32px 20px; }
    .sheets h2 { margin: 6px 0 18px; font: 700 26px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; }
    .sheets ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .sheets a { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 8px; padding: 9px 10px; color: var(--ink); text-decoration: none; border: 1.5px solid transparent; }
    .sheets a:hover { border-color: var(--ink); }
    .sheets a .no { font: 500 13px/1.5 var(--mono); }
    .sheets a .nm { font-weight: 700; font-size: 15px; line-height: 1.35; }
    .sheets a .tm { grid-column: 2; font: 400 12px/1.4 var(--mono); color: var(--ink-2); }
    .sheets a .tm::before { content: "□ "; }
    .sheets a.seen .tm::before { content: "■ "; color: var(--field); }
    .sheets a[aria-current="page"] { background: var(--ink); color: var(--paper); }
    .sheets a[aria-current="page"] .tm { color: rgba(243, 244, 239, .8); }
    .sheets a[aria-current="page"].seen .tm::before { color: var(--flag); }
    .sheets a:focus-visible { outline-offset: -4px; }
    .sheets .key { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--ink-2); }
    .sheets .key span { display: flex; gap: 8px; align-items: center; }
    .sheets .key i { width: 22px; height: 10px; flex: none; }

    main { min-width: 0; padding: 28px clamp(16px, 4vw, 56px) 64px; }
    main:focus { outline: none; }
    /* the sheet is a container: its parts respond to the room the sheet has, whether the index sits
       beside it or not */
    .page { max-width: 860px; margin: 0 auto; container: page / inline-size; }

    /* title block, like the corner of a drawing sheet */
    .tblock { display: grid; grid-template-columns: 110px minmax(0, 1fr) 128px 168px; border: 1.5px solid var(--ink); background: var(--sheet); margin-bottom: 36px; }
    .tblock > div { padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; }
    .tblock > div + div { border-left: 1.5px solid var(--ink); }
    .tblock b { font: 700 28px/1 var(--display); }
    .tblock .tb-meta b { font-size: 21px; line-height: 1.1; }
    .tblock h1 { margin: 0; font: 700 clamp(30px, 6cqi, 46px)/1 var(--display); text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; hyphens: auto; }
    .tblock h1:focus { outline: none; }

    /* key question: what this sheet answers */
    .kq { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 4px 14px; margin: 0 0 22px; }
    .kq::before { content: ""; width: 14px; height: 14px; margin-top: 7px; background: var(--boundary); grid-row: span 2; }
    .kq p { margin: 0; font: 600 clamp(24px, 3vw, 31px)/1.12 var(--display); text-wrap: balance; }
    .lede { font-size: 19px; max-width: 62ch; margin: 0 0 8px; }

    h2.sec { display: flex; align-items: baseline; gap: 12px; margin: 52px 0 12px; padding-top: 10px; border-top: 1.5px solid var(--ink); font: 700 25px/1.15 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
    h2.sec .n { font: 500 13px/1 var(--mono); color: var(--ink-2); letter-spacing: .04em; }
    h3 { font: 700 18px/1.3 var(--body); margin: 0 0 6px; }
    p { margin: 0 0 14px; max-width: 66ch; }
    ul, ol { margin: 0 0 14px; padding-left: 22px; }
    li { margin: 4px 0; }
    strong { font-weight: 700; }
    .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .cols2 { columns: 2; column-gap: 32px; }
    .cols2 li { break-inside: avoid; }

    /* the running example, pinned to the sheet like a survey tag */
    .sitenote { position: relative; border: 1.5px solid var(--ink); background: var(--sheet); padding: 34px 18px 16px; }
    .sitenote > .label { position: absolute; top: -1.5px; left: -1.5px; padding: 5px 10px; background: var(--flag); color: var(--ink); border: 1.5px solid var(--ink); }
    .sitenote p { margin: 0 0 10px; font-size: 16px; }
    .sitenote p:last-child { margin: 0; }

    /* a document extract: a quoted clause with its reference */
    .extract { margin: 14px 0 18px; padding: 16px 20px; background: var(--sheet); border: 1px solid var(--hair); border-left: 4px solid var(--ink); }
    .extract .label { display: block; margin-bottom: 6px; }
    .extract p { font-style: italic; margin: 0 0 8px; }
    .extract p:last-child { margin: 0; }
    .plain { background: linear-gradient(transparent 58%, var(--flag-tint) 58%); }

    /* legend: the five parts of a scope (and other sets) as map symbols */
    .legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1.5px solid var(--ink); background: var(--sheet); margin: 16px 0 22px; }
    .legend > div { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .legend > div + div { border-left: 1px solid var(--hair); }
    .legend svg { width: 40px; height: 40px; }
    .legend b { font: 700 19px/1.1 var(--display); text-transform: uppercase; }
    .legend small { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
    .sym { color: var(--ink); }

    /* expandable legend entries */
    details.entry { border: 1.5px solid var(--ink); background: var(--sheet); margin: -1.5px 0 0; }
    details.entry:first-of-type { margin-top: 14px; }
    details.entry summary { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; cursor: pointer; list-style: none; }
    details.entry summary::-webkit-details-marker { display: none; }
    details.entry summary svg { width: 34px; height: 34px; }
    details.entry summary b { font: 700 21px/1.15 var(--display); text-transform: uppercase; }
    details.entry summary small { display: block; font-size: 14px; color: var(--ink-2); font-weight: 400; }
    details.entry summary::after { content: "+"; font: 500 22px/1 var(--mono); width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--ink); }
    details.entry[open] summary::after { content: "−"; background: var(--ink); color: var(--paper); }
    details.entry summary:hover b { text-decoration: underline; text-underline-offset: 4px; }
    details.entry summary:focus-visible { outline-offset: -4px; }
    details.entry > .body { padding: 4px 16px 18px 70px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
    details.entry > .body.one { grid-template-columns: minmax(0, 1fr); }
    .applied { border-top: 3px solid var(--plan); padding-top: 10px; }
    .applied .label { color: var(--plan); display: block; margin-bottom: 6px; }
    .applied ul { margin: 0; }
    details.entry { interpolate-size: allow-keywords; }
    details.entry::details-content { height: 0; overflow: clip; transition: height .28s ease, content-visibility .28s allow-discrete; }
    details.entry[open]::details-content { height: auto; }

    /* tables, drawn with ruling pen weights */
    .tablewrap { overflow-x: auto; margin: 14px 0 20px; }
    table { width: 100%; border-collapse: collapse; background: var(--sheet); font-size: 15px; }
    th, td { border: 1px solid var(--ink); padding: 9px 12px; text-align: left; vertical-align: top; }
    thead th { font: 600 15px/1.2 var(--display); text-transform: uppercase; letter-spacing: .03em; background: var(--ink); color: var(--paper); }
    tbody th { font-weight: 700; width: 30%; }
    td ul { margin: 0; padding-left: 18px; }

    /* the scope statement, set out like an approved planning permit */
    .permit { position: relative; border: 1.5px solid var(--ink); background: var(--sheet); margin: 16px 0 24px; }
    .permit header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; padding: 12px 16px; border-bottom: 1.5px solid var(--ink); }
    .permit header b { font: 700 24px/1.1 var(--display); text-transform: uppercase; }
    .permit dl { margin: 0; display: grid; grid-template-columns: 170px minmax(0, 1fr); }
    .permit dt, .permit dd { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--hair); }
    .permit dt { font: 500 12px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); padding-top: 13px; }
    .permit dd ul { margin: 0; padding-left: 18px; }
    .permit dt.out, .permit dt.out + dd { background: repeating-linear-gradient(-45deg, transparent 0 7px, rgba(178, 53, 32, .07) 7px 9px); }
    .permit dt.lim, .permit dt.lim + dd { background: var(--flag-tint); }
    .permit .signoff { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .stamp { flex: none; width: 128px; margin: -6px 0 -10px; transform: rotate(-7deg); color: var(--boundary); opacity: .9; }

    /* field tasks: the activities */
    .task { position: relative; margin: 40px 0; border: 2px solid var(--ink); background: var(--sheet); }
    .task > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 2px solid var(--ink);
      background: repeating-linear-gradient(-45deg, var(--sheet) 0 8px, var(--plan-tint) 8px 10px); }
    .task > header .label { color: var(--ink); background: var(--sheet); padding: 2px 6px; }
    .task > .inner { padding: 18px 20px 20px; }
    .task h3 { font: 700 24px/1.1 var(--display); text-transform: uppercase; margin-bottom: 8px; }
    .q { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 8px 16px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--hair); }
    .q label { font-size: 16px; }
    .q select { width: 100%; min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--sheet); }
    .q .why { grid-column: 1 / -1; margin: 0; font-size: 15px; display: none; }
    .q.right .why, .q.wrong .why { display: block; }
    .q.right .why { color: var(--field); }
    .q.wrong .why { color: var(--boundary); }
    .q.right select { border-color: var(--field); box-shadow: inset 4px 0 var(--field); }
    .q.wrong select { border-color: var(--boundary); box-shadow: inset 4px 0 var(--boundary); }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
    .btn { min-height: 44px; padding: 10px 18px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700; cursor: pointer; border-radius: 0; }
    .btn:hover { background: var(--plan); border-color: var(--plan); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.ghost:hover { background: var(--plan-tint); }
    .btn[disabled] { opacity: .45; cursor: default; }
    .score { font: 500 14px/1.4 var(--mono); }

    /* hold the line: the scope creep simulator */
    .htl { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    .memo { border: 1.5px solid var(--ink); background: #fff; }
    .memo .head { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); font-size: 14px; }
    .memo .head span { font: 500 11px/1.9 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
    .memo .text { padding: 14px 14px 4px; font-size: 18px; line-height: 1.45; }
    .memo .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 14px 14px; }
    .memo .choices .btn { padding: 10px 8px; font-size: 15px; }
    .memo .choices .add { background: var(--plan); border-color: var(--plan); }
    .memo .choices .decline { background: var(--sheet); color: var(--ink); }
    .memo .choices .decline:hover { background: var(--boundary-tint); }
    .memo .choices .log { background: var(--flag); color: var(--ink); border-color: var(--ink); }
    .memo .choices .btn[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
    .verdict { margin-top: 12px; padding: 12px 14px; border-left: 5px solid var(--ink); background: var(--sheet); font-size: 16px; }
    .verdict.good { border-color: var(--field); background: var(--field-tint); }
    .verdict.bad { border-color: var(--boundary); background: var(--boundary-tint); }
    .verdict b { display: block; margin-bottom: 2px; }
    .gauges { border: 1.5px solid var(--ink); background: var(--sheet); padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
    .gauge .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
    .gauge .top b { font: 500 13px/1.4 var(--mono); }
    .gauge .track { position: relative; height: 12px; margin-top: 6px; border: 1.5px solid var(--ink); background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--hair) calc(10% - 1px) 10%); }
    .gauge .fill { position: absolute; inset: 0 auto 0 0; background: var(--plan); transition: width .45s ease; }
    .gauge.over .fill { background: repeating-linear-gradient(-45deg, var(--boundary) 0 5px, #8e2a19 5px 9px); }
    .gauge.over .top b { color: var(--boundary); }
    .boundary { border: 2px dashed var(--boundary); padding: 10px 12px 12px; position: relative; margin-top: 4px; }
    .boundary > .label { position: absolute; top: -10px; left: 10px; background: var(--sheet); padding: 0 6px; color: var(--boundary); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { font-size: 13px; padding: 3px 8px; border: 1px solid var(--ink); background: #fff; }
    .chip.in { border-color: var(--plan); background: var(--plan-tint); }
    .chip.out { text-decoration: line-through; color: var(--ink-2); }
    .chip.log { background: var(--flag-tint); }
    .progress-line { font: 500 13px/1.4 var(--mono); color: var(--ink-2); margin-bottom: 8px; }

    /* contour map of the strategy (the old pyramid, as a hill: mission at the summit) */
    .hill { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; margin: 14px 0 20px; }
    .hill svg { width: 100%; height: auto; display: block; }
    .hill svg .ring { fill: transparent; stroke: var(--ink); stroke-width: 1.5; cursor: pointer; transition: fill .2s ease; }
    .hill svg .ring:hover { fill: rgba(31, 86, 163, .08); }
    .hill svg .ring.on { fill: rgba(242, 190, 58, .35); stroke-width: 2.5; }
    .hill svg text { font: 600 15px var(--display); text-transform: uppercase; fill: var(--ink); pointer-events: none; letter-spacing: .03em; }
    .hill .levels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .hill .levels button { min-height: 40px; padding: 6px 12px; border: 1.5px solid var(--ink); background: var(--sheet); cursor: pointer; font-weight: 700; }
    .hill .levels button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .hill .panel { border: 1.5px solid var(--ink); background: var(--sheet); padding: 14px 16px; min-height: 120px; }
    .hill .panel b { font: 700 22px/1.1 var(--display); text-transform: uppercase; display: block; margin-bottom: 6px; }
    .hill .panel p { margin: 0; }

    /* the milk run: a floor plan of the shop with both routes drawn on it */
    .mapwrap { max-width: 620px; margin: 18px 0 0; }
    .map { border: 1.5px solid var(--ink); background: #fff; margin: 14px 0 6px; }
    .map svg { display: block; width: 100%; height: auto; }
    .map .shelf { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; }
    .map .shelf-label { font: 600 13px var(--display); text-transform: uppercase; fill: var(--ink); letter-spacing: .04em; }
    .map .planned { fill: none; stroke: var(--plan); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    /* the actual route: a solid red line that draws itself along the path, cut into dashes by a
       white line laid over it */
    .map .actual { fill: none; stroke: var(--boundary); stroke-width: 3; stroke-linecap: butt; stroke-linejoin: round; }
    .map .gaps { fill: none; stroke: #fff; stroke-width: 5; stroke-dasharray: 0 9 7 0; stroke-linejoin: round; }
    .map .stop { fill: var(--boundary); }
    .map .start { fill: var(--ink); }
    .map .note { font: 500 11px var(--mono); fill: var(--ink-2); }
    .map-key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; margin: 8px 0 18px; }
    .map-key span { display: flex; align-items: center; gap: 8px; }
    .map-key i { display: inline-block; width: 28px; height: 0; border-top: 3.5px solid var(--plan); }
    .map-key i.r { border-top: 3px dashed var(--boundary); }
    .tally { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1.5px solid var(--ink); background: var(--sheet); margin: 0 0 22px; }
    .tally > div { padding: 12px 14px; }
    .tally > div + div { border-left: 1.5px solid var(--ink); }
    .tally b { font: 700 30px/1 var(--display); display: block; }
    .tally .plan-c { color: var(--plan); }
    .tally .act-c { color: var(--boundary); }

    /* anatomy of a scope: the boundary diagram */
    .anatomy { border: 1.5px solid var(--ink); background: #fff; margin: 14px 0 22px; }
    .anatomy svg { display: block; width: 100%; height: auto; }
    .anatomy text { font-family: var(--body); font-size: 14px; fill: var(--ink); }
    .anatomy .t { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .03em; }

    /* why it matters: three marks */
    .marks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--ink); background: var(--sheet); margin: 14px 0 22px; }
    .marks > div { padding: 16px 16px 6px; }
    .marks > div + div { border-left: 1px solid var(--hair); }
    .marks svg { width: 40px; height: 40px; margin-bottom: 8px; }
    .marks h3 { font: 700 20px/1.1 var(--display); text-transform: uppercase; }
    .marks p { font-size: 15px; }

    /* RACI matrix */
    .raci-key { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 18px; }
    .raci-key div { border: 1.5px solid var(--ink); background: var(--sheet); padding: 10px 12px; font-size: 15px; }
    .letter { display: inline-grid; place-items: center; width: 28px; height: 28px; font: 700 18px/1 var(--display); border: 1.5px solid var(--ink); margin-right: 6px; vertical-align: middle; }
    .letter.R { background: var(--ink); color: var(--paper); }
    .letter.A { background: var(--boundary); color: #fff; border-color: var(--boundary); }
    .letter.C { background: var(--plan-tint); }
    .letter.I { background: #fff; }
    table.matrix td, table.matrix th { text-align: center; vertical-align: middle; }
    table.matrix tbody th { text-align: left; font-weight: 400; width: auto; }
    table.matrix tr.yours th { font-weight: 700; }
    table.matrix tr.yours td { background: repeating-linear-gradient(-45deg, transparent 0 7px, rgba(31, 86, 163, .08) 7px 9px); font: 500 14px var(--mono); color: var(--ink-2); }

    /* Gantt chart on graph paper */
    .gantt { overflow-x: auto; margin: 14px 0 6px; }
    .gantt table { min-width: 640px; table-layout: fixed; }
    .gantt th, .gantt td { border-color: var(--hair); padding: 0; height: 34px; }
    .gantt thead th { background: var(--sheet); color: var(--ink); font: 500 12px/1 var(--mono); text-align: center; border-bottom: 1.5px solid var(--ink); }
    .gantt thead th:first-child, .gantt tbody th { width: 190px; text-align: left; padding: 0 10px; font: 400 14px/1.2 var(--body); }
    .gantt td.on { background: repeating-linear-gradient(-45deg, var(--plan) 0 6px, #2b66ba 6px 9px); border-top: 7px solid var(--sheet); border-bottom: 7px solid var(--sheet); }
    .gantt td.ms { position: relative; }
    .gantt td.ms::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; background: var(--boundary); transform: translate(-50%, -50%) rotate(45deg); }

    /* resources */
    .res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--ink); background: var(--sheet); margin: 14px 0 22px; }
    .res > div { padding: 14px 14px 8px; }
    .res > div + div { border-left: 1px solid var(--hair); }
    .res svg { width: 34px; height: 34px; }
    .res h3 { font: 700 20px/1.1 var(--display); text-transform: uppercase; margin: 6px 0; }
    .res p { font-size: 15px; }
    .incident { border: 1.5px solid var(--ink); background: #fff; margin: 14px 0 22px; display: grid; grid-template-columns: 120px minmax(0, 1fr); }
    .incident .when { padding: 14px; border-right: 1.5px solid var(--ink); background: var(--boundary-tint); }
    .incident .when b { font: 700 32px/1 var(--display); display: block; color: var(--boundary); }
    .incident .what { padding: 14px 16px 4px; }
    .overlays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 22px; }
    .overlays > div { border: 1.5px solid var(--ink); background: var(--sheet); padding: 12px 14px 4px; font-size: 15px; }
    .overlays > div.lim { background: var(--flag-tint); }
    .overlays > div.out { background: repeating-linear-gradient(-45deg, var(--sheet) 0 7px, rgba(178, 53, 32, .07) 7px 9px); }
    .overlays .label { display: block; margin-bottom: 6px; color: var(--ink); }

    /* margin notes: reflection, saved in this browser only */
    .margin { margin: 40px 0 10px; border-top: 1.5px solid var(--ink); padding-top: 14px; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; }
    .margin h2 { font: 700 22px/1.1 var(--display); text-transform: uppercase; margin: 4px 0 0; }
    .margin label { display: block; margin-bottom: 8px; }
    .margin textarea { width: 100%; min-height: 104px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 0; resize: vertical; line-height: 1.5;
      background: #fff repeating-linear-gradient(transparent 0 calc(1.5em - 1px), var(--plan-tint) calc(1.5em - 1px) 1.5em); background-position: 0 10px; }
    .margin .saved { font: 400 12px/1.4 var(--mono); color: var(--ink-2); margin-top: 6px; min-height: 1.4em; }

    .done { border: 2px solid var(--ink); background: var(--sheet); padding: 18px 20px; margin: 40px 0 0; position: relative; }
    .done h2 { font: 700 26px/1.1 var(--display); text-transform: uppercase; margin: 0 0 10px; }
    .done ol { margin: 0; }

    /* previous / next sheet */
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; padding-top: 16px; border-top: 1.5px solid var(--ink); }
    .pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); text-decoration: none; }
    .pager a:hover { background: var(--ink); color: var(--paper); }
    .pager a.next { text-align: right; grid-column: 2; }
    .pager a span { font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .pager a b { font: 700 20px/1.15 var(--display); text-transform: uppercase; }

    /* gentle motion: sections settle in, routes draw themselves; all off for reduced motion */
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .page > * { animation: rise .4s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--n, 0) * 35ms); }
    .map .actual.draw { stroke-dasharray: 1; animation: route 3.2s cubic-bezier(.45, .05, .4, 1) both; }
    @keyframes route { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @container page (max-width: 800px) {
      .tblock { grid-template-columns: 90px minmax(0, 1fr); }
      .tblock .tb-meta { border-top: 1.5px solid var(--ink); }
      .tblock .tb-meta:nth-of-type(3) { border-left: 0; }
      .gauge .top { flex-direction: column; gap: 0; }
    }

    @media (max-width: 900px) {
      .frame { grid-template-columns: minmax(0, 1fr); background: none; min-height: 0; }
      .bar .menu { display: inline-block; }
      .sheets { display: none; position: static; max-height: none; border-bottom: 1.5px solid var(--ink); background: var(--sheet); }
      .sheets.open { display: block; }
      .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .legend > div { border-top: 1px solid var(--hair); }
      .legend > div:nth-child(odd) { border-left: 0; }
      .two, .hill, .htl { grid-template-columns: minmax(0, 1fr); }
      .marks, .overlays { grid-template-columns: minmax(0, 1fr); }
      .marks > div + div { border-left: 0; border-top: 1px solid var(--hair); }
      .res { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .res > div:nth-child(3) { border-left: 0; }
      .res > div:nth-child(n+3) { border-top: 1px solid var(--hair); }
      .raci-key { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      details.entry > .body { grid-template-columns: minmax(0, 1fr); padding-left: 16px; }
      .permit dl { grid-template-columns: minmax(0, 1fr); }
      .permit dt { border-bottom: 0; padding-bottom: 0; }
      .margin { grid-template-columns: minmax(0, 1fr); }
      .q { grid-template-columns: minmax(0, 1fr); }
      .cols2 { columns: 1; }
      .scale ol { display: none; }
    }
    @media (max-width: 520px) {
      body { font-size: 16px; }
      .bar { gap: 10px; padding: 8px 14px; }
      .bar .course { font-size: 15px; }
      .bar .course small { display: none; }
      .memo .choices { grid-template-columns: minmax(0, 1fr); }
      .incident { grid-template-columns: minmax(0, 1fr); }
      .incident .when { border-right: 0; border-bottom: 1.5px solid var(--ink); }
      .tally b { font-size: 24px; }
      .pager { grid-template-columns: minmax(0, 1fr); }
      .pager a.next { grid-column: 1; }
    }
    @media (forced-colors: active) {
      .gauge .fill, .gantt td.on { background: Highlight; }
      .sheets a[aria-current="page"] { border-color: Highlight; }
    }
  </style>
</head>

// ---------- the running example ----------
const SCOPE = {
  goal: "Keep residents informed and connected with a monthly newsletter about local news, events and council services.",
  deliverables: ["The first three monthly issues: an 8-page print edition and a matching email edition", "A newsletter template and masthead the team can reuse", "A sign-up page on the council website for the email edition"],
  tasks: ["Choose a name and design the masthead", "Plan the story list for the first three issues", "Write and edit the stories", "Lay out and proofread each issue", "Print and deliver to letterboxes", "Send the email edition to subscribers"],

const sitenote = `<aside class="sitenote"><span class="label">Site note · running example</span><p>You're in the communications team at Riverbend City Council. The council wants a monthly community newsletter, in print and by email, to keep residents up to date with local news, events and services.</p><p>We follow this project through every sheet.</p></aside>`;

// ---------- the six sheets ----------
const PAGES = [
{
  id: "goals", no: "1.1", title: "Organisational goals", time: 20,
  html: () => `
    ${kq("What are organisational goals?")}
    <p class="lede">The long-term outcomes an organisation is working towards. Every project, team and role should serve at least one of them.</p>

    <h2 class="sec"><span class="n">1.1.1</span>Start with the mission</h2>
    <p>Most organisations sum up why they exist in a mission statement. This is Riverbend City Council's:</p>
    <div class="extract"><span class="label">Extract · Riverbend Council Plan</span><p>"Riverbend City Council works alongside our community to make Riverbend a welcoming, connected and sustainable place to live, work and visit.</p><p>We listen first, act openly, and look after the services and spaces our residents rely on, now and for the generations to come."</p></div>

    <h2 class="sec"><span class="n">1.1.2</span>From mission to goals</h2>
    <p>To live out that mission, the council has set six goals:</p>
    <ol class="cols2">${["Keep residents informed and involved in decisions", "Strengthen connections between neighbours and community groups", "Support local businesses to grow", "Make council services easy to find and use", "Care for parks, waterways and green spaces", "Spend ratepayers' money responsibly"].map((g) => `<li>${g}</li>`).join("")}</ol>

    <h2 class="sec"><span class="n">1.1.3</span>Line your project up</h2>
    <p>A project that clearly serves the goals is easier to approve, fund and defend. Read the council's strategy like a hill on a contour map: the mission is the summit, and every project should be able to climb to it.</p>
    <p>Choose a level to see what sits there.</p>
    <div class="hill">
      <div>
        <div class="levels" role="group" aria-label="Strategy levels" id="levels"></div>
        <div class="panel" id="levelPanel" aria-live="polite"><b>Start at the summit</b><p>Each level should point to the one above it. If your project can't, ask why it exists.</p></div>
      </div>
      <svg id="contours" viewBox="0 0 400 300" aria-hidden="true"></svg>
    </div>

    <h2 class="sec"><span class="n">1.1.4</span>Example: the newsletter</h2>
    <p>Here's how the newsletter climbs to the council's mission. If you can fill in a table like this, you can explain why your project deserves time and money.</p>
    <div class="tablewrap"><table>
      <thead><tr><th scope="col">Council</th><th scope="col">How the newsletter serves it</th></tr></thead>
      <tbody>
        <tr><th scope="row">Mission</th><td>Makes Riverbend more "welcoming and connected" by sharing what's on locally.</td></tr>
        <tr><th scope="row">Goal 1 · informed</th><td>Every issue covers upcoming decisions and how to have a say.</td></tr>
        <tr><th scope="row">Goal 2 · connected</th><td>A regular page for community groups and events.</td></tr>
        <tr><th scope="row">Goal 3 · local business</th><td>A "shop local" feature in each issue.</td></tr>
        <tr><th scope="row">Goal 4 · easy services</th><td>A back page of key contacts and bin days.</td></tr>
      </tbody>
    </table></div>
  `,
  init: (root) => {
    const LEVELS = [
      ["Mission", "Why the organisation exists. It rarely changes."],
      ["Vision", "What the organisation hopes the future looks like if it succeeds."],
      ["Goals", "The broad, long-term outcomes it's working towards."],
      ["Objectives", "Specific, measurable steps towards each goal, usually with a date attached."],
      ["Projects", "The work that delivers the objectives. Your project sits here, so it should trace back up through every level above it."],
    ];
    // five contours: the summit ring is the mission, the widest ring the projects
    const svg = root.querySelector("#contours");
    const rings = LEVELS.map((l, i) => {
      const rx = 52 + i * 34, ry = 26 + i * 25, cy = 72 + i * 22;
      return `<ellipse class="ring" data-i="${i}" cx="200" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
    }).reverse().join("");
    const labels = LEVELS.map(([n], i) => `<text x="200" y="${i === 0 ? 77 : 72 + i * 22 + 26 + i * 25 - 10}" text-anchor="middle">${n}</text>`).join("");
    svg.innerHTML = `<path d="M200 22v-12" stroke="#17232A" stroke-width="2"/><path d="M200 10h18l-4 5 4 5h-18" fill="#B23520"/>${rings}${labels}`;
    const panel = root.querySelector("#levelPanel"), levels = root.querySelector("#levels");
    levels.innerHTML = LEVELS.map(([n], i) => `<button type="button" aria-pressed="false" data-i="${i}">${n}</button>`).join("");
    const pick = (i) => {
      levels.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.i === i));
      svg.querySelectorAll(".ring").forEach((r) => r.classList.toggle("on", +r.dataset.i === i));
      panel.innerHTML = `<b>${LEVELS[i][0]}</b><p>${LEVELS[i][1]}</p>`;
    };
    levels.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) pick(+b.dataset.i); });
    svg.addEventListener("click", (e) => { const r = e.target.closest(".ring"); if (r) pick(+r.dataset.i); });
  },

{
  id: "policies", no: "1.2", title: "Policies and procedures", time: 20,
  html: () => `
    ${kq("How do policies shape a project?")}
    <p class="lede">Policies set the rules for how projects are approved, run and reported. Following them keeps the work on time, on budget and within the law.</p>

    <h2 class="sec"><span class="n">1.2.1</span>What to look for</h2>
    <p>Policies are long and formal, so know what you're looking for before you read. Most project policies cover seven areas:</p>
    <ol class="cols2">${["Lines of authority and approvals", "Quality assurance", "People and resourcing", "Budgets and finance", "Risk management", "Recordkeeping", "Reporting"].map((a) => `<li>${a}</li>`).join("")}</ol>

    <h2 class="sec"><span class="n">1.2.2</span>Case study: Riverbend's project policy</h2>
    <p>Open each area to read the clause and what it means in plain English.</p>
    ${[
      ["Lines of authority and approvals", "Who can decide and sign off?", "3.1", "Every project must have a Project Sponsor at Manager level or above, who holds the budget and approves the project at each stage gate.", "The sponsor owns the money and the big decisions. The project manager runs the day-to-day work but can't overrule the sponsor."],
      ["Quality assurance", "How is the work checked?", "4.2", "All public-facing communication must be reviewed against the Council Style Guide and approved by the Communications Manager before release.", "Nothing reaches residents without a style check and a manager's approval, so plan time for review."],
      ["People and resourcing", "Who does the work?", "5.1", "The Project Manager is responsible for coordinating project staff and contractors, and for ensuring they follow relevant council policies, including procurement and workplace safety.", "If you bring in a designer or printer, you make sure they follow council rules too."],
      ["Budgets and finance", "How is money approved and tracked?", "6.3", "Expenditure must be approved by an officer with the appropriate financial delegation. Purchases over $5,000 require three written quotes.", "Check who can approve spending, and get three quotes for big costs like printing."],
      ["Risk management", "How are problems spotted early?", "7.1", "A risk assessment must be completed before the project starts and reviewed at each stage gate, using the council's risk register.", "List what could go wrong, like a late print run, before you start, and keep the list current."],
      ["Recordkeeping", "Where do documents live?", "8.4", "Documents created or received in the course of council business are public records and must be saved to the council's records system.", "Drafts, quotes and approvals go in the official system, not someone's inbox."],

      <div id="quiz"></div>
    </div></section>
  `,

// ---------- a reusable "choose the answer" field task ----------
let qid = 0;
function quiz(el, options, items, onCheck) {
  const base = qid; qid += items.length;
  const opts = '<option value="">Choose…</option>' + options.map((o) => `<option>${o}</option>`).join("");
  el.innerHTML = items.map(([q, a], i) => `<div class="q" data-a="${a}"><label for="q${base + i}">${q}</label><select id="q${base + i}">${opts}</select><p class="why"></p></div>`).join("") +
    '<div class="btns"><button type="button" class="btn">Check answers</button><button type="button" class="btn ghost">Clear</button><span class="score" aria-live="polite"></span></div>';
  const [check, clear] = el.querySelectorAll(".btns button"), score = el.querySelector(".score");
  check.onclick = () => {
    let right = 0;
    el.querySelectorAll(".q").forEach((q, i) => {
      const v = q.querySelector("select").value, ok = v === q.dataset.a;
      right += ok;
      q.classList.toggle("right", ok);
      q.classList.toggle("wrong", !ok);
      q.querySelector(".why").textContent = (ok ? "✓ Correct. " : v ? `✗ Not quite: it's ${q.dataset.a}. ` : `Answer: ${q.dataset.a}. `) + items[i][2];
    });
    score.textContent = `${right} of ${items.length} correct`;
    if (onCheck) onCheck([...el.querySelectorAll(".q")].map((q) => ({ value: q.querySelector("select").value, answer: q.dataset.a })));
  };
  clear.onclick = () => {
    el.querySelectorAll(".q").forEach((q) => { q.classList.remove("right", "wrong"); q.querySelector("select").value = ""; });
    score.textContent = "";
    if (onCheck) onCheck(null);
  };
}

function holdTheLine(el) {
  const START = { spent: 11200, hours: 6 };
  const BUDGET = 12000, HOURS = 6;
  const REQS = [
    { from: "Proofreader, communications team", re: "Masthead typo", text: "The masthead proof says \"Riverbned\". Can we fix it before the files go to print?", best: "add", cost: 0, hrs: 0,
      fb: { add: "Yes. Fixing a deliverable so it meets the standard is part of the work you agreed to.", decline: "This one belongs in scope: a correct masthead is part of the deliverable. Declining sends a typo to every letterbox.", log: "No need to wait. Fixing the masthead is already part of delivering the issue." } },
    { from: "Owner, Bean There café", re: "Ad space", text: "We'd pay $200 to have an ad in every issue.", best: "decline", cost: 0, hrs: 0.5,
      fb: { add: "Paid advertising is listed under Out of scope. Selling ad space needs its own policy and approval, and someone's time.", decline: "Right. Paid advertising is listed under Out of scope, so you can say no straight away.", log: "No need to log it: the scope already rules out paid advertising." } },
    { from: "Mayor's office", re: "Mayor's column", text: "Could the mayor have a column in every issue?", best: "log", cost: 0, hrs: 1.5,
      fb: { add: "It sounds small, but a monthly column is new work: writing, approvals, layout. That's 1.5 hours a week your team doesn't have.", decline: "It isn't ruled out by the scope, and it may well serve the council's goals. That's the sponsor's call, so log it.", log: "Right. It's new work that isn't in the scope or ruled out by it. Log it as a change request and let the sponsor decide." } },
    { from: "Multicultural liaison officer", re: "Translations", text: "Can issue one also come out in Vietnamese and Arabic?", best: "decline", cost: 2400, hrs: 2,
      fb: { add: "Translated editions are listed under Out of scope, planned for a later phase. Adding them now costs about $2,400 and two hours a week.", decline: "Right. Translations are out of scope for now and already planned for a later phase. Point them to that plan.", log: "It's already decided: the scope says translations come in a later phase. Decline, and point them to that plan." } },
    { from: "Printer", re: "Paper stock", text: "Your paper is out of stock. The closest match costs $40 more per issue.", best: "add", cost: 120, hrs: 0,
      fb: { add: "Good call. You can't deliver without paper, and $120 fits inside what's left of the budget.", decline: "Declining doesn't make the paper appear. The issue still needs printing, and $120 fits within the budget.", log: "Waiting holds up printing. This change is needed to deliver, and it fits within the budget." } },
    { from: "Communications manager", re: "Video version", text: "Can we film a short video version of each issue?", best: "log", cost: 1500, hrs: 4,
      fb: { add: "A video series is a new deliverable. At about $1,500 and 4 hours a week, it breaks both the budget and the team's time.", decline: "It's not ruled out, and it comes from your sponsor. Log it as a change request so it gets a proper decision.", log: "Right. It's a new deliverable worth considering for the next phase. Log it so the sponsor can weigh it properly." } },
  ];
  const VERB = { add: "Add to scope", decline: "Decline", log: "Log for later" };
  let at = 0, state, picks;
  const money = (n) => "$" + n.toLocaleString("en-AU");
  function reset() { at = 0; state = { ...START }; picks = []; render(); }
  function gauges() {
    const budgetOver = state.spent > BUDGET, hoursOver = state.hours > HOURS;
    const weeksLate = Math.max(0, Math.ceil(state.hours - HOURS));
    return `<div class="gauges" role="group" aria-label="Project gauges">
      <div class="gauge${budgetOver ? " over" : ""}"><div class="top"><span>Budget committed</span><b>${money(state.spent)} of ${money(BUDGET)}</b></div><div class="track" aria-hidden="true"><div class="fill" style="width:${Math.min(100, state.spent / BUDGET * 100)}%"></div></div></div>
      <div class="gauge${hoursOver ? " over" : ""}"><div class="top"><span>Team hours a week</span><b>${state.hours} of ${HOURS}</b></div><div class="track" aria-hidden="true"><div class="fill" style="width:${Math.min(100, state.hours / HOURS * 100)}%"></div></div></div>
      <div class="gauge${weeksLate ? " over" : ""}"><div class="top"><span>First issue</span><b>${weeksLate ? `${weeksLate} week${weeksLate > 1 ? "s" : ""} late` : "1 March, on track"}</b></div></div>
      <div class="boundary"><span class="label">In scope</span><div class="chips">${chips("add") || '<span class="chip">the agreed scope</span>'}</div></div>
      <div><span class="label">Logged for the sponsor</span><div class="chips">${chips("log") || '<span class="chip" style="border-style:dashed">nothing yet</span>'}</div></div>
      <div><span class="label">Declined</span><div class="chips">${chips("decline") || '<span class="chip" style="border-style:dashed">nothing yet</span>'}</div></div>
    </div>`;
  }
  function chips(kind) { return picks.map((p, i) => p === kind ? `<span class="chip ${kind === "add" ? "in" : kind === "log" ? "log" : "out"}">${REQS[i].re}</span>` : "").join(""); }
  function render(feedback) {
    if (at >= REQS.length) return finish();
    const r = REQS[at];
    const answered = picks.length > at;
    el.innerHTML = `<p class="progress-line">Request ${at + 1} of ${REQS.length}</p><div class="htl">
      <div><article class="memo" aria-labelledby="memo-re"><div class="head"><span>From</span><div>${r.from}</div><span>Re</span><div id="memo-re"><strong>${r.re}</strong></div></div>
        <p class="text" tabindex="-1">${r.text}</p>
        <div class="choices" role="group" aria-label="Your decision">${["add", "decline", "log"].map((k) => `<button type="button" class="btn ${k}" data-k="${k}" aria-pressed="${picks[at] === k}" ${answered ? "disabled" : ""}>${VERB[k]}</button>`).join("")}</div></article>
        <div id="verdict" aria-live="polite">${feedback || ""}</div>
      </div>${gauges()}</div>`;
    el.querySelectorAll(".choices button").forEach((b) => (b.onclick = () => decide(b.dataset.k)));
    const next = el.querySelector("#nextReq");
    if (next) { next.onclick = () => { at++; render(); const t = el.querySelector(".memo .text, .result"); if (t) t.focus(); }; next.focus(); }
  }
  function decide(k) {
    const r = REQS[at];
    picks[at] = k;
    if (k === "add") { state.spent += r.cost; state.hours = +(state.hours + r.hrs).toFixed(1); }
    const good = k === r.best;
    render(`<div class="verdict ${good ? "good" : "bad"}"><b>${good ? "✓ " + VERB[k] + " was the call." : "✗ The scope points to: " + VERB[r.best] + "."}</b>${r.fb[k]}</div><div class="btns"><button type="button" class="btn" id="nextReq">${at + 1 < REQS.length ? "Next request →" : "See your result →"}</button></div>`);
  }
  function finish() {
    const right = picks.filter((p, i) => p === REQS[i].best).length;
    el.innerHTML = `<div class="htl"><div><p class="result" tabindex="-1" style="font:700 34px/1.05 var(--display);text-transform:uppercase;margin:0 0 10px">You held the line on ${right} of ${REQS.length}</p>
      <p>Every request had an answer in the scope statement. Exclusions mean a quick no. Work that's needed to deliver what you agreed gets done. Anything new, however good, is logged for the sponsor to weigh against the budget and the date.</p>
      <div class="btns"><button type="button" class="btn ghost" id="again">Try again</button></div></div>${gauges()}</div>`;
    el.querySelector("#again").onclick = reset;
  }
  reset();
}

// ---------- margin notes: kept in this browser only ----------
function notes(root) {
  root.querySelectorAll("textarea[data-note]").forEach((t) => {
    const key = "riverbend-note-" + t.dataset.note, saved = t.parentElement.querySelector(".saved");
    try { t.value = localStorage.getItem(key) || ""; } catch (e) {}
    let timer;
    t.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        try { localStorage.setItem(key, t.value); saved.textContent = "Saved in this browser."; } catch (e) { saved.textContent = "This browser can't save notes, so copy anything you want to keep."; }
      }, 400);
    });
  });
}

// ---------- the course frame: sheet index, progress, routing ----------
const toc = document.getElementById("toc"), pageEl = document.getElementById("page"), main = document.getElementById("main");
const scale = document.getElementById("scale"), scaleText = document.getElementById("scaleText");
const sheets = document.getElementById("sheets"), menu = document.getElementById("menu");
const seen = new Set();
toc.innerHTML = PAGES.map((p) => `<li><a href="#${p.id}" data-id="${p.id}"><span class="no">${p.no}</span><span class="nm">${p.title}</span><span class="tm">${p.time} min</span></a></li>`).join("");
scale.innerHTML = PAGES.map(() => "<li></li>").join("");
let first = true;
function show() {
  const i = Math.max(0, PAGES.findIndex((p) => "#" + p.id === location.hash));
  const p = PAGES[i], prev = PAGES[i - 1], next = PAGES[i + 1];
  seen.add(p.id);
  pageEl.innerHTML = `
    <header class="tblock">
      <div><span class="label">Sheet</span><b>${p.no}</b></div>
      <div><span class="label">Module 1 · Scoping a project</span><h1 tabindex="-1">${p.title}</h1></div>
      <div class="tb-meta"><span class="label">Time</span><b>${p.time} min</b></div>
      <div class="tb-meta"><span class="label">Example</span><b>Riverbend newsletter</b></div>
    </header>
    ${p.html()}
    <nav class="pager" aria-label="Sheets">${prev ? `<a href="#${prev.id}"><span>← Sheet ${prev.no}</span><b>${prev.title}</b></a>` : ""}${next ? `<a class="next" href="#${next.id}"><span>Sheet ${next.no} →</span><b>${next.title}</b></a>` : ""}</nav>`;
  [...pageEl.children].forEach((c, n) => c.style.setProperty("--n", Math.min(n, 8)));
  if (p.init) p.init(pageEl);
  notes(pageEl);
  toc.querySelectorAll("a").forEach((a) => {
    if (a.dataset.id === p.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    a.classList.toggle("seen", seen.has(a.dataset.id));
  });
  [...scale.children].forEach((li, n) => { li.className = n === i ? "now" : seen.has(PAGES[n].id) ? "seen" : ""; });
  scaleText.textContent = `Sheet ${i + 1} of ${PAGES.length}`;
  document.title = `${p.title} · Module 1 · Scoping a project`;
  sheets.classList.remove("open");
  menu.setAttribute("aria-expanded", "false");
  // a new sheet starts at its top, and screen readers hear its title
  if (!first) {
    window.scrollTo(0, 0);
    pageEl.querySelector("h1").focus({ preventScroll: true });
  }
  first = false;
  parent !== window && parent.postMessage({ module: "sheet", id: p.id }, "*");
}
// a table too wide for the screen scrolls sideways, so it can take keyboard focus to be scrolled
function scrollers() {
  pageEl.querySelectorAll(".tablewrap, .gantt").forEach((w) => {
    if (w.scrollWidth > w.clientWidth + 1) {
      w.tabIndex = 0;
      w.setAttribute("role", "region");
      w.setAttribute("aria-label", "Table, scrolls sideways");
    } else {
      w.removeAttribute("tabindex");
      w.removeAttribute("role");
      w.removeAttribute("aria-label");
    }
  });
}
window.addEventListener("hashchange", () => requestAnimationFrame(scrollers));
window.addEventListener("resize", scrollers);
requestAnimationFrame(scrollers);
menu.addEventListener("click", () => { const open = sheets.classList.toggle("open"); menu.setAttribute("aria-expanded", open); });
window.addEventListener("hashchange", show);
show();
</script>
