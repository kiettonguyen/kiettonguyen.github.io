<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiet Nguyen — Choose a version</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #f6f4ef;
      color: #141414;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 880px; }
    p.label { font-size: .8rem; text-transform: uppercase; letter-spacing: .15em; color: #6b6b6b; margin-bottom: 24px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    a {
      display: block;
      padding: 40px 32px;
      border: 1px solid #141414;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: background .3s, color .3s;
    }
    a:hover { background: #141414; color: #f6f4ef; }
    a h2 { font-family: "Fraunces", Georgia, serif; font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 8px; }
    a span { opacity: .7; }
    @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="label">Kiet Nguyen — portfolio drafts</p>
    <div class="options">
      <a href="experimental/">
        <h2>Experimental →</h2>
        <span>Interactive three.js scroll gallery</span>
      </a>
      <a href="plain/">
        <h2>Plain →</h2>
        <span>Simple, clean HTML &amp; CSS</span>
      </a>
    </div>
  </main>
</body>
</html>
